<header class="topbar">
  <nav class="menu">
    <div class="brand-block">
      <button
        mat-icon-button
        aria-label="Ouvrir le menu"
        (click)="toggleSidebar()">
        <mat-icon>menu</mat-icon>
      </button>

      <a class="brand-home" routerLink="/home" aria-label="Accueil ISFCE">
        <img class="brand-logo" src="assets/isfce-logo.png" alt="Logo ISFCE">
        <span class="brand-copy">
          <span class="brand-title">Portail des demandes de dispense</span>
          <span class="brand-subtitle">Espace etudiant securise</span>
        </span>
      </a>
    </div>

    <div class="actions">
      @if (!authenticated()) {
        <button mat-stroked-button color="primary" (click)="login()">
          <mat-icon>login</mat-icon>
          Se connecter
        </button>
      } @else {
        <app-dossier-stat></app-dossier-stat>
        <button mat-icon-button color="warn" matTooltip="Deconnexion : {{getCurrentUsername()}}" (click)="logout()">
          <mat-icon>logout</mat-icon>
        </button>
      }
    </div>
  </nav>
</header>
