name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Run backend tests and build the application JAR
        run: ./gradlew --no-daemon test bootJar

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dispense_app_ang
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dispense_app_ang/package-lock.json
      - name: Use the npm version recorded in package.json
        run: npm install --global npm@11.6.2
      - run: npm ci
      - name: Run Angular tests
        run: npm test -- --watch=false
      - name: Build Angular
        run: npm run build

  keycloak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify the synthetic realm imports
        shell: bash
        run: |
          export PID_KEYCLOAK_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          trap 'docker compose -f keycloak/compose.yml down' EXIT
          docker compose -f keycloak/compose.yml up -d
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors --max-time 5 \
            http://localhost:8084/realms/DISP/.well-known/openid-configuration |
            jq -e '.issuer == "http://localhost:8084/realms/DISP" and (.code_challenge_methods_supported | index("S256") != null)'
          curl --fail --silent --show-error http://localhost:8084/realms/DISP/protocol/openid-connect/certs |
            jq -e '.keys | length > 0'
